<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 ATP Server</title>
<style>
  :root {
    --bg: #1e1e2e;
    --kart: #2e2e42;
    --mor: #7c4dff;
    --turkuaz: #00bcd4;
    --yesil: #4caf50;
    --acik: #7cfc00;
    --kapali: #ff5555;
    --soluk: #bbb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  /* Giriş animasyonu: iki daire köşelerden kayar */
  .daire {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .sol-ust {
    background: var(--mor);
    top: -100px;
    left: -100px;
    animation: soldan 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  .sag-alt {
    background: var(--turkuaz);
    bottom: -100px;
    right: -100px;
    animation: sagdan 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes soldan { from { transform: translate(-200px, -200px); } to { transform: none; } }
  @keyframes sagdan { from { transform: translate(200px, 200px); } to { transform: none; } }

  /* Arka plan: yukarıdan aşağı akan yıldızlar */
  #yildizlar {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .yildiz {
    position: absolute;
    top: -10px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.8;
    animation: akis linear infinite;
  }
  @keyframes akis { to { transform: translateY(110vh); } }

  main {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 60px 24px 40px;
  }
  h1 { font-size: 40px; color: red; margin: 0 0 20px; }

  input {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: var(--kart);
    color: #fff;
    font-size: 16px;
  }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: var(--yesil);
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  button.ikincil { background: var(--kart); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--turkuaz); outline-offset: 2px; }

  #kart {
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    background: var(--kart);
  }
  .durum { font-size: 24px; margin: 0 0 10px; }
  .acik { color: var(--acik); }
  .kapali { color: var(--kapali); }
  .satir { font-size: 18px; margin: 8px 0 0; overflow-wrap: anywhere; }
  .motd { font-size: 16px; color: var(--soluk); margin-top: 12px; white-space: pre-line; }

  @media (prefers-reduced-motion: reduce) {
    .daire, .yildiz { animation: none; }
  }
</style>
</head>
<body>
  <div class="daire sol-ust"></div>
  <div class="daire sag-alt"></div>
  <div id="yildizlar"></div>

  <main>
    <h1>10 ATP Server</h1>
    <input id="ip" type="text" placeholder="Sunucu IP" autocapitalize="none" autocomplete="off">
    <button id="kontrol">Kontrol Et</button>
    <div id="kart" hidden></div>
  </main>

<script>
  // Kendi sunucunun IP adresini buraya yaz (tırnakları silme)
  const SUNUCU_IP = "hypixel.net";

  const ipKutusu = document.getElementById("ip");
  const kart = document.getElementById("kart");
  ipKutusu.value = SUNUCU_IP;

  // Yıldızları oluştur
  const yildizAlani = document.getElementById("yildizlar");
  for (let i = 0; i < 25; i++) {
    const y = document.createElement("div");
    const boyut = 2 + Math.random() * 3;
    y.className = "yildiz";
    y.style.left = Math.random() * 100 + "%";
    y.style.width = y.style.height = boyut + "px";
    y.style.animationDuration = 4 + Math.random() * 6 + "s";
    y.style.animationDelay = -Math.random() * 10 + "s";
    yildizAlani.appendChild(y);
  }

  function satirEkle(metin, sinif) {
    const p = document.createElement("p");
    p.className = sinif || "satir";
    p.textContent = metin;
    kart.appendChild(p);
    return p;
  }

  async function kontrolEt() {
    const ip = ipKutusu.value.trim();
    if (!ip) return;
    kart.hidden = false;
    kart.replaceChildren();
    satirEkle("Yükleniyor...", "satir");
    try {
      const res = await fetch("https://api.mcsrvstat.us/3/" + encodeURIComponent(ip));
      const d = await res.json();
      kart.replaceChildren();
      satirEkle(d.online ? "🟢 Açık" : "🔴 Kapalı", "durum " + (d.online ? "acik" : "kapali"));
      if (d.online) {
        satirEkle("Oyuncu: " + (d.players?.online ?? "?") + "/" + (d.players?.max ?? "?"));
        satirEkle("Sürüm: " + (d.version ?? "?"));
        if (d.motd?.clean) satirEkle(d.motd.clean.join("\n"), "motd");
        if (d.players?.list?.length) {
          satirEkle("Online: " + d.players.list.map((p) => p.name).join(", "));
        }
        const kopya = document.createElement("button");
        kopya.className = "ikincil";
        kopya.textContent = "IP'yi kopyala";
        kopya.onclick = async () => {
          try {
            await navigator.clipboard.writeText(ip);
            kopya.textContent = "Kopyalandı";
          } catch (e) {
            kopya.textContent = "Kopyalanamadı";
          }
        };
        kart.appendChild(kopya);
      }
    } catch (e) {
      kart.replaceChildren();
      satirEkle("Bağlanılamadı, internetini kontrol et.", "satir kapali");
    }
  }

  document.getElementById("kontrol").addEventListener("click", kontrolEt);
  ipKutusu.addEventListener("keydown", (e) => { if (e.key === "Enter") kontrolEt(); });
  kontrolEt();
</script>
</body>
</html>
