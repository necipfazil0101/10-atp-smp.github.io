<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 ATP Server</title>
<style>
  :root {
    --bg: #12121c;
    --kart: rgba(46, 46, 66, 0.65);
    --mor: #7c4dff;
    --turkuaz: #00bcd4;
    --yesil: #4caf50;
    --acik: #7cfc00;
    --kapali: #ff5555;
    --soluk: #aab;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 10%, #25254a 0%, var(--bg) 55%);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  /* Köşelerden kayan daireler */
  .daire {
    position: fixed;
    width: 340px;
    height: 340px;
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }
  .sol-ust { background: var(--mor); top: -120px; left: -120px; animation: soldan 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  .sag-alt { background: var(--turkuaz); bottom: -120px; right: -120px; animation: sagdan 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes soldan { from { transform: translate(-200px, -200px); } to { transform: none; } }
  @keyframes sagdan { from { transform: translate(200px, 200px); } to { transform: none; } }

  /* Akan yıldızlar */
  #yildizlar { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .yildiz { position: absolute; top: -10px; background: #fff; border-radius: 50%; opacity: 0.7; animation: akis linear infinite; }
  @keyframes akis { to { transform: translateY(110vh); } }

  main {
    position: relative;
    z-index: 1;
    max-width: 560px;
    margin: 0 auto;
    padding: 70px 24px 40px;
    text-align: center;
    animation: gir 0.9s ease both;
  }
  @keyframes gir { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  h1 {
    font-size: clamp(36px, 9vw, 56px);
    margin: 0 0 6px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff4d4d, #ff8a5c, var(--mor));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .alt { color: var(--soluk); margin: 0 0 36px; font-size: 15px; }

  /* Büyük, silik yazılı IP kutusu: tıklayınca yazı kaybolur */
  input {
    width: 100%;
    padding: 18px 10px;
    border: 0;
    border-bottom: 2px solid rgba(255, 255, 255, 0.18);
    background: transparent;
    color: #fff;
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 700;
    text-align: center;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  input::placeholder {
    color: rgba(255, 255, 255, 0.2);
    opacity: 1;
    transition: opacity 0.25s;
  }
  input:focus::placeholder { opacity: 0; }
  input:focus {
    outline: none;
    border-bottom-color: var(--turkuaz);
    box-shadow: 0 10px 20px -14px var(--turkuaz);
  }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(90deg, var(--yesil), #2e9e6a);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -8px var(--yesil); }
  button:active { transform: translateY(0); }
  button.ikincil { background: rgba(255, 255, 255, 0.1); margin-top: 16px; }
  button.ikincil:hover { box-shadow: none; background: rgba(255, 255, 255, 0.16); }
  button:focus-visible { outline: 2px solid var(--turkuaz); outline-offset: 2px; }

  #kart {
    margin-top: 28px;
    padding: 24px;
    border-radius: 18px;
    background: var(--kart);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    text-align: left;
    animation: gir 0.5s ease both;
  }
  .ust { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .ikon {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    image-rendering: pixelated;
    background: rgba(255, 255, 255, 0.06);
    flex: none;
  }
  .durum { font-size: 26px; font-weight: 700; margin: 0; }
  .acik { color: var(--acik); }
  .kapali { color: var(--kapali); }
  .satir { font-size: 18px; margin: 10px 0 0; overflow-wrap: anywhere; }
  .motd { font-size: 16px; color: var(--soluk); margin-top: 14px; white-space: pre-line; padding-left: 12px; border-left: 3px solid var(--mor); }

  @media (prefers-reduced-motion: reduce) {
    .daire, .yildiz, main, #kart { animation: none; }
  }
</style>
</head>
<body>
  <div class="daire sol-ust"></div>
  <div class="daire sag-alt"></div>
  <div id="yildizlar"></div>

  <main>
    <h1>10 ATP Server</h1>
    <p class="alt">Sunucunun durumunu anında kontrol et</p>
    <input id="ip" type="text" placeholder="Sunucu IP girin" autocapitalize="none" autocomplete="off" spellcheck="false">
    <button id="kontrol">Kontrol Et</button>
    <div id="kart" hidden></div>
  </main>

<script>
  // İstersen kendi sunucunun IP adresini buraya yaz (boş bırakırsan kutu boş açılır)
  const SUNUCU_IP = "";

  const ipKutusu = document.getElementById("ip");
  const kart = document.getElementById("kart");
  ipKutusu.value = SUNUCU_IP;

  // Yıldızlar
  const yildizAlani = document.getElementById("yildizlar");
  for (let i = 0; i < 30; i++) {
    const y = document.createElement("div");
    const boyut = 2 + Math.random() * 3;
    y.className = "yildiz";
    y.style.left = Math.random() * 100 + "%";
    y.style.width = y.style.height = boyut + "px";
    y.style.animationDuration = 4 + Math.random() * 6 + "s";
    y.style.animationDelay = -Math.random() * 10 + "s";
    yildizAlani.appendChild(y);
  }

  function satirEkle(metin, sinif, ust) {
    const p = document.createElement("p");
    p.className = sinif || "satir";
    p.textContent = metin;
    (ust || kart).appendChild(p);
    return p;
  }

  async function kontrolEt() {
    const ip = ipKutusu.value.trim();
    if (!ip) { ipKutusu.focus(); return; }
    kart.hidden = false;
    kart.replaceChildren();
    satirEkle("Yükleniyor...", "satir");
    try {
      const res = await fetch("https://api.mcsrvstat.us/3/" + encodeURIComponent(ip));
      const d = await res.json();
      kart.replaceChildren();

      const ust = document.createElement("div");
      ust.className = "ust";
      // Sunucu resmi (ikon)
      const img = document.createElement("img");
      img.className = "ikon";
      img.alt = "Sunucu ikonu";
      img.src = d.icon || ("https://api.mcsrvstat.us/icon/" + encodeURIComponent(ip));
      img.onerror = () => img.remove();
      ust.appendChild(img);
      satirEkle(d.online ? "🟢 Açık" : "🔴 Kapalı", "durum " + (d.online ? "acik" : "kapali"), ust);
      kart.appendChild(ust);

      if (d.online) {
        satirEkle("Oyuncu: " + (d.players?.online ?? "?") + "/" + (d.players?.max ?? "?"));
        satirEkle("Sürüm: " + (d.version ?? "?"));
        if (d.motd?.clean) satirEkle(d.motd.clean.join("\n"), "motd");
        if (d.players?.list?.length) {
          satirEkle("Online: " + d.players.list.map((p) => p.name).join(", "));
        }
        const kopya = document.createElement("button");
        kopya.className = "ikincil";
        kopya.textContent = "IP'yi kopyala";
        kopya.onclick = async () => {
          try {
            await navigator.clipboard.writeText(ip);
            kopya.textContent = "Kopyalandı";
          } catch (e) {
            kopya.textContent = "Kopyalanamadı";
          }
        };
        kart.appendChild(kopya);
      }
    } catch (e) {
      kart.replaceChildren();
      satirEkle("Bağlanılamadı, internetini kontrol et.", "satir kapali");
    }
  }

  document.getElementById("kontrol").addEventListener("click", kontrolEt);
  ipKutusu.addEventListener("keydown", (e) => { if (e.key === "Enter") kontrolEt(); });
  if (SUNUCU_IP) kontrolEt();
</script>
</body>
</html>
